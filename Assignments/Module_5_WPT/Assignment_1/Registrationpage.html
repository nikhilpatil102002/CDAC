<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Centering the form */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ebd2e7;
        }

        /* Form container */
        .registration-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .registration-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Styling each input field */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: #555;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 30%;
            padding: 1px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 1px;
            font-size: 16px;
        }

        /* Styling the submit button */
        .submit-btn {
            width: 50%;
            padding: 5px;
            font-size: 16px;
            color: #fff;
            background-color: #76d88d;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            width: 50%;
            padding: 5px;
            font-size: 16px;
            color: #fff;
            background-color: #f02323;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #218838;
        }
        .cancel-btn:hover {
            background-color: #471616;
        }


        .button-container {
    display: flex;
    justify-content: space-between; /* Places buttons on opposite sides */
    margin-top: 10px;
}

        /* Optional: adding responsiveness */
        @media (max-width: 480px) {
            .registration-container {
                padding: 15px;
            }

            input[type="text"], input[type="email"], input[type="password"] {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="registration-container">
        <h2>Registration Form</h2>
        <h4>Personal Information</h4>
        <form action="/submit-registration" method="POST">
            <div class="form-group">
                <label for="firstname">Firstname</label>
                <input type="text" id="firstname" name="firstname" required>
                <label for="firstname">Place of Birth</label>
                <input type="text" id="Place of Birth" name="Place of Birth " required>
            </div>
            <div class="form-group">
                <label for="lastname">Lastname</label>
                <input type="text" id="lastname" name="lastname" required>
                <label for="firstname">Nationality</label>
                <input type="text" id="Nationality" name="Nationality" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="firstname">Domicile</label>
                <input type="text" id="Domicile" name="Domicile" required>
            </div>
            <div class="form-group">
                <label for="Date of Birth">Date of Birth</label>
                <input type="text" id="Date of Birth" name="Date of Birth" required>
                <label for="firstname">CP Domicile</label>
                <input type="text" id="CP Domicile" name="CP Domicile" required>
            </div>
            <div class="form-group">
                <label for="Gender">Gender :</label>
               
                <label for="male">Male</label>
                <input type="text" id="male" name="gender" required>
                <label for="female">Female</label>
                <input type="text" id="other" name="gender" required>

            </div>
            <div class="form-group">
                <label for="Marital  Status ">Marital Status</label>
                <input type="text" id="Marital Status" name="Marital Status" required>
                <label for="Start Time">Start Time</label>
                <input type="text" id="Start Time" name="Start Time" required>
            </div>
            
            <div class="form-group">
                <label for="Country">Country</label>
                <input type="text" id="Country" name="Country" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <label for="PostCode">Post Code</label>
                <input type="text" id="PostCode" name="PostCode" required>
            </div>
            <h4>Address</h4>
            <div class="form-group">
                <label for="Present Address">Present Address</label>
                <input type="text" id="Present Address" name="Present Address" required>
            </div>

            <div class="form-group">
                <label for="The City">The City</label>
                <input type="text" id="The City" name="The City" required>
            </div>

            <div class="form-group">
                <label for="PinCode">PinCode</label>
                <input type="text" id="PinCode" name="PinCode" required>
            </div>

            <div class="button-container">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="button" class="cancel-btn">Cancel</button>
            </div>

            
        </form>
    </div>

</body>
</html>
